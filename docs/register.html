<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Static registration interface preview for NoteShareHub.">
  <title>Register | NoteShareHub</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/demo.css">
</head>
<body class="demo-page">
  <div class="demo-notice"><strong>Static demo:</strong> registration is unavailable. Do not enter real personal or account information.</div>
  <nav class="navbar navbar-expand-lg navbar-custom"><div class="container"><a class="navbar-brand" href="index.html"><img src="assets/img/logo.svg" alt=""><span><span class="text-primary">NoteShare</span>Hub</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button><div class="collapse navbar-collapse" id="siteNav"><ul class="navbar-nav me-auto ms-lg-3"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="browse.html">Browse Notes</a></li><li class="nav-item"><a class="nav-link" href="about.html">About</a></li></ul><div class="d-flex gap-2 mt-3 mt-lg-0"><a class="btn btn-outline-primary" href="login.html">Login</a></div></div></div></nav>
  <main class="container py-5">
    <section class="form-card demo-form"><div class="text-center mb-4"><h1 class="h3">Create an account</h1><p class="text-muted small">Registration interface preview</p></div>
      <form data-demo-form data-demo-message="Static demo only: account creation is unavailable. No form data was sent or saved.">
        <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" autocomplete="off" placeholder="Demo name" required></div>
        <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" autocomplete="off" placeholder="you@example.test" required></div>
        <div class="row g-3 mb-3"><div class="col-sm-6"><label class="form-label" for="department">Department</label><select class="form-select" id="department" required><option value="">Choose one</option><option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>Mechanical</option><option>Civil</option></select></div><div class="col-sm-6"><label class="form-label" for="semester">Semester</label><select class="form-select" id="semester" required><option value="">Choose one</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div></div>
        <button class="btn btn-primary w-100" type="submit">Preview registration</button><div class="alert alert-info mt-3 demo-result" data-demo-result aria-live="polite" hidden></div>
      </form><p class="text-center small text-muted mt-3 mb-0">Already registered? <a href="login.html">Login preview</a></p>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><a href="index.html">Back to NoteShareHub</a></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/demo.js"></script>
</body>
</html>
